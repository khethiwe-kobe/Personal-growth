name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-growth-tracker-fs2po8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          # Publishable client values — safe to embed in the static bundle.
          NEXT_PUBLIC_SUPABASE_URL: https://neuryvymxahyuwpzksiv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ekuxN9v0hmJsieAMBHf95w_E1fHYnE1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
