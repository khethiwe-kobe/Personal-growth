name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-growth-tracker-fs2po8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          DEPLOY_TARGET: pages
          # Publishable client values — safe to embed in the static bundle.
          NEXT_PUBLIC_SUPABASE_URL: https://neuryvymxahyuwpzksiv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ekuxN9v0hmJsieAMBHf95w_E1fHYnE1
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
